<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BMC Atelier">
<meta name="theme-color" content="#0f0e0c">
<meta name="description" content="BMC Atelier: the owner, the artisan and the house. A clickable prototype by the Yellow Team, ESSEC EMDT.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>BMC Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Manrope:wght@200;300;400;500;600&family=Mrs+Saint+Delafield&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap">
<style>
/* Shell: an ivory desk around the phone, the emblem on a charcoal bar (design system logo rule). */
:root {
  --bg: #ebe6dc; --panel: #f7f3eb; --fg: #16130f; --muted: #615d56; --line: #d5d0c6;
  --accent: #7c5c29; --accent-tint: #f1e8d8; --bar: #28292d; --bar-fg: #f2efea; --bar-muted: #aaa69e; --bar-gold: #c5a574;
  --serif-ui: Cormorant, "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --label-ui: Jost, Futura, "Avenir Next", "Helvetica Neue", sans-serif;
  --sans-ui: Manrope, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0e0c; --panel: #1b1a17; --fg: #f2efea; --muted: #aaa69e; --line: #3a3833; --accent: #c5a574; --accent-tint: #1f1a12; --bar: #1b1b1e; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0f0e0c; --panel: #1b1a17; --fg: #f2efea; --muted: #aaa69e; --line: #3a3833; --accent: #c5a574; --accent-tint: #1f1a12; --bar: #1b1b1e; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans-ui); font-size: 14px; line-height: 21px; }
.shell { min-height: 100%; display: flex; flex-direction: column; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-fg); padding: 12px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand img { height: 22px; width: auto; display: block; }
.brand__name { font-family: var(--serif-ui); font-size: 24px; line-height: 28px; font-weight: 400; margin: 0; white-space: nowrap; }
.brand__tag { margin: 0; font-family: var(--label-ui); font-size: 10.5px; line-height: 14px; letter-spacing: .26em; text-transform: uppercase; color: var(--bar-muted); white-space: nowrap; }
.views { margin-left: auto; display: flex; gap: 4px; padding: 4px; border: 1px solid #44444a; border-radius: 999px; }
.views button { height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--bar-muted); cursor: pointer; font-family: var(--label-ui); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
.views--theme { margin-left: 0; }
.views button[aria-pressed="true"] { background: #3a3326; color: var(--bar-gold); box-shadow: inset 0 0 0 1px rgba(197,165,116,.45); }
.views button:focus-visible, .shell button:focus-visible, .shell a:focus-visible { outline: 2px solid var(--bar-gold); outline-offset: 2px; }

.stage { flex: 1; display: grid; grid-template-columns: minmax(220px, 270px) minmax(0, 1fr) minmax(240px, 300px); gap: 32px; padding: 24px; align-items: start; }
.rail, .notes { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.group { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
.group[data-on="true"] { box-shadow: inset 0 0 0 1px var(--accent); }
.group__head { padding: 12px 14px 10px; display: flex; flex-direction: column; }
.group__name { font-family: var(--serif-ui); font-size: 20px; line-height: 24px; }
.group__sub { font-family: var(--label-ui); font-size: 10.5px; line-height: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
.group ol { list-style: none; margin: 0; padding: 4px 0 8px; border-top: 1px solid var(--line); }
.group ol button { width: 100%; display: flex; gap: 10px; align-items: baseline; padding: 6px 14px; background: none; border: 0; color: var(--muted); cursor: pointer; text-align: left; font: inherit; font-size: 13px; line-height: 18px; }
.group ol button:hover { color: var(--fg); }
.group ol button[aria-current="true"] { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; width: 32px; flex: none; opacity: .75; }
.lens { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.lens button { height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
.lens button[aria-checked="true"] { background: var(--accent-tint); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.lens--wide { align-self: flex-start; min-width: 300px; }
.lens--three { grid-template-columns: repeat(3, minmax(0, 1fr)); min-width: 340px; }
.lens--three button[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.same { display: flex; flex-direction: column; align-items: center; gap: 6px; }
@media (max-width: 420px) { .lens--three { min-width: 0; width: 100%; } .lens--three button { padding: 0 6px; letter-spacing: .12em; } }
.person { min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; flex: none; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--label-ui); font-size: 8px; letter-spacing: .08em; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.group__head--row { flex-direction: row; align-items: center; gap: 10px; }
.group ol li.part { padding: 10px 14px 2px; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }

.device { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; width: 100%; }
.device__owner { margin: 0; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
.holder { position: relative; }
.frame { position: absolute; top: 0; left: 0; width: max-content; border-radius: 54px; padding: 12px; background: #19191b; box-shadow: 0 0 0 1px #2a2a2e, 0 24px 64px rgba(0,0,0,.35); transform-origin: top left; }
.frame .s-screen { border-radius: 42px; }

.notes .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.notes .eyebrow { margin: 0; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); }
.notes h2 { font-family: var(--serif-ui); font-weight: 400; font-size: 26px; line-height: 30px; margin: 0; text-wrap: balance; }
.notes p { margin: 0; color: var(--muted); }
.notes strong { color: var(--fg); font-weight: 500; }
.storynav { display: flex; gap: 8px; }
.storynav button { flex: 1; height: 44px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; font-family: var(--label-ui); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
.storynav button.primary { background: var(--accent); color: var(--panel); }

.chooser { display: none; gap: 6px; flex-wrap: wrap; justify-content: center; }
.narrow { display: none; flex-direction: column; align-items: center; gap: 10px; }
.chooser button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; }
.chooser button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }

.two { padding: 32px 24px 48px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.two__head { max-width: 620px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.two__head h2 { margin: 0; font-family: var(--serif-ui); font-weight: 300; font-size: 48px; line-height: 52px; }
.two__head h2 em { color: var(--accent); }
.two__head p { margin: 0; color: var(--muted); font-size: 15px; }
.two__phones { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; width: 100%; }
.two__col { display: flex; flex-direction: column; gap: 12px; align-items: center; min-width: 0; }
.two__cap { margin: 0; max-width: 290px; text-align: center; color: var(--muted); }
.two__cap strong { color: var(--fg); font-weight: 500; }
.cta { height: 48px; padding: 0 28px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); cursor: pointer; font-family: var(--label-ui); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }

.two__toggle { margin-top: 4px; }
.two__prec, .four__prec { margin: 0; max-width: 290px; text-align: center; font-size: 12.5px; line-height: 18px; color: var(--muted); }
.two__prec a, .four__prec a, .notes a, .trust a { color: var(--accent); }
.phase { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
.phase--pilot { background: var(--accent); color: var(--panel); }
.phase--test { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.phase--p2 { box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; color: var(--muted); font-size: 13px; }
.legend span.phase { margin-right: 6px; }
.trust { padding: 32px 24px 56px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.trust__grid { width: 100%; max-width: 1080px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; }
.trust .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.trust .card h3 { margin: 0; font-family: var(--serif-ui); font-weight: 400; font-size: 26px; line-height: 30px; }
.trust .card p { margin: 0; color: var(--muted); }
.trust .card p strong { color: var(--fg); font-weight: 500; }
.trust__eyebrow { margin: 0; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); }
.see { width: 100%; border-collapse: collapse; }
.see th, .see td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: center; font-size: 14px; }
.see th { font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.see td:first-child, .see th:first-child { text-align: left; font-family: var(--serif-ui); font-size: 19px; color: var(--fg); }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; }
.dot--yes { background: var(--accent); }
.dot--if { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px var(--accent); }
.dot--no { box-shadow: inset 0 0 0 1.5px var(--line); }
@media (max-width: 900px) { .trust__grid { grid-template-columns: minmax(0, 1fr); } }
.all { padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 44px; }
.all__group { display: flex; flex-direction: column; gap: 16px; }
.all__head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.all__head h2 { margin: 0; font-family: var(--serif-ui); font-weight: 400; font-size: 32px; line-height: 36px; }
.all__head p { margin: 0; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
.all__grid { display: flex; flex-wrap: wrap; gap: 26px 22px; }
.thumb { display: flex; flex-direction: column; gap: 8px; }
.thumb__box { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.thumb__box .s-screen { transform-origin: top left; }
.thumb__box:hover { box-shadow: 0 0 0 1px var(--accent); }
.thumb__label { font: inherit; font-size: 13px; line-height: 18px; display: flex; gap: 8px; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.thumb__label .num { color: var(--accent); opacity: 1; width: auto; }

@media (max-width: 1100px) {
  .stage { grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); }
  .rail { display: none; }
  .chooser { display: flex; }
  .narrow { display: flex; }
}
@media (max-width: 760px) {
  .bar { padding: 10px 16px; gap: 12px; }
  .brand__tag { white-space: normal; letter-spacing: .18em; }
  .views { margin-left: 0; justify-content: space-between; }
  .views button { padding: 0 10px; font-size: 10.5px; letter-spacing: .14em; }
  .bar { position: static; }
  .brand { flex: 1 1 0; }
  .views--theme { width: auto; order: 1; }
  .views:not(.views--theme) { width: 100%; order: 2; flex-wrap: wrap; justify-content: center; border-radius: 22px; }
  .views button { height: 32px; padding: 0 8px; }
  .stage { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 20px; }
  .two, .all { padding-inline: 16px; }
  .two__head h2 { font-size: 36px; line-height: 40px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* Phone only */
.devbar { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.focus-btn { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; }
.focus-btn:hover, .focus-bar button:not(:disabled):hover { color: var(--accent); border-color: var(--accent); }
.focus-btn svg, .focus-exit svg { width: 14px; height: 14px; flex: none; }
html.is-focus .bar { display: none; }
.focus-stage { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; padding: 16px 16px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.focus-bar { display: flex; align-items: center; gap: 2px; padding: 4px; max-width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.focus-bar button { height: 36px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; font-family: var(--label-ui); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.focus-bar button[data-story] { font-size: 22px; letter-spacing: 0; }
.focus-bar button:disabled { opacity: .35; cursor: default; }
.focus-label { padding: 0 8px; font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.focus-label .num { width: auto; margin-right: 8px; color: var(--accent); opacity: 1; }
.focus-sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; flex: none; }
@media (max-width: 480px) { .focus-exit span { display: none; } .focus-bar button { padding: 0 10px; } }
@media (min-width: 1000px) {
  .focus-stage { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); column-gap: 28px; padding: 20px 24px; }
  .focus-stage .holder { grid-column: 2; }
  .focus-bar { grid-column: 3; justify-self: start; align-self: end; flex-direction: column; gap: 4px; padding: 6px; border-radius: 24px; width: 168px; }
  .focus-bar button { width: 100%; }
  .focus-label { white-space: normal; text-align: center; padding: 4px 8px; line-height: 18px; }
  .focus-label .num { display: block; margin: 0 0 2px; }
  .focus-sep { width: 60%; height: 1px; margin: 2px 0; }
}

/* The tour: one stop at a time, the screen large, a caption and Next beside it. */
.tour { flex: 1; display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); grid-template-rows: 1fr 1fr; grid-template-areas: "cap dev" "nav dev"; column-gap: 40px; padding: 24px 32px; min-height: 0; }
.tour__cap { grid-area: cap; align-self: end; display: flex; flex-direction: column; gap: 14px; padding-bottom: 18px; }
.tour__nav { grid-area: nav; align-self: start; display: flex; flex-direction: column; gap: 14px; }
.tour__dev { grid-area: dev; display: flex; align-items: center; justify-content: center; min-width: 0; }
.tour__chs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.tour__chs button { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
.tour__chs button[aria-current="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
.tour__chs button[data-done="true"] { color: var(--fg); }
.tour__eyebrow { margin: 0; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); }
.tour h2 { margin: 0; font-family: var(--serif-ui); font-weight: 300; font-size: 44px; line-height: 48px; text-wrap: balance; }
.tour h2 em { color: var(--accent); }
.tour__line { margin: 0; font-size: 16px; line-height: 25px; color: var(--muted); text-wrap: pretty; }
.tour__tip { margin: 0; display: flex; gap: 10px; align-items: baseline; font-size: 14px; line-height: 21px; color: var(--fg); }
.tour__tip span { flex: none; font-family: var(--label-ui); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.tour__prog { height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
.tour__prog span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.tour__btns { display: flex; gap: 8px; }
.tour__btns button { flex: 1; height: 48px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; font-family: var(--label-ui); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
.tour__btns button.primary { flex: 2; background: var(--accent); color: var(--panel); }
.tour__btns button:disabled { opacity: .35; cursor: default; }
.tour__exit { align-self: flex-start; padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.tour__exit:hover { color: var(--accent); }
.tour__keys { margin: 0; font-size: 12px; color: var(--muted); }
.tour__end { max-width: 560px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.tour__end .tour__links { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.tour__end .tour__links button { height: 52px; padding: 0 22px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left; font: inherit; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
.tour__end .tour__links button:hover { border-color: var(--accent); color: var(--accent); }
.ctas { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.streams { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 16px; }
.stream { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 28px; padding: 20px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); align-items: center; }
.stream--house { background: transparent; border-style: dashed; }
.stream__txt { display: flex; flex-direction: column; gap: 6px; }
.stream__n { margin: 0; font-family: var(--serif-ui); font-weight: 300; font-size: 40px; line-height: 40px; color: var(--accent); }
.stream h3 { margin: 0; font-family: var(--serif-ui); font-weight: 400; font-size: 28px; line-height: 32px; }
.stream h3 em { color: var(--accent); }
.stream__who { font-family: var(--label-ui); font-size: 10.5px !important; letter-spacing: .22em; text-transform: uppercase; color: var(--fg) !important; }
.stream__txt p { margin: 0; color: var(--muted); }
.stream__shots { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
@media (max-width: 900px) { .stream { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .stream { padding: 16px 12px; } .stream__shots { gap: 12px; } }
.cta--ghost { background: transparent; color: var(--accent); }
@media (max-width: 999px) {
  .tour { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "cap" "dev" "nav"; padding: 18px 16px 28px; row-gap: 18px; }
  .tour__cap { align-self: start; padding-bottom: 0; gap: 10px; }
  .tour h2 { font-size: 34px; line-height: 38px; }
  .tour__keys { display: none; }
  .tour__nav { position: sticky; bottom: 0; z-index: 5; margin: 0 -16px -28px; padding: 10px 16px 14px; gap: 8px; background: var(--bg); box-shadow: 0 -1px 0 var(--line); }
  .tour__btns button { height: 44px; }
}

/* BuildMyCar Studio app, v2 — the Lovable build's ivory, gold and serif identity,
   dressed with the BuildMyCar design system: winged emblem on a charcoal band,
   pill actions, radius-m cards, widget tiles, gold foil rule, wax seal,
   Phosphor Light icons. */
:root {
  --ivory: #f7f3eb;        /* Lovable --background */
  --ivory-2: #efebe1;      /* Lovable --card */
  --ivory-3: #e9e4da;      /* Lovable --secondary */
  --line: #d5d0c6;         /* Lovable --border */
  --line-strong: #8f897e;
  --ink: #16130f;          /* Lovable --foreground */
  --ink-muted: #615d56;    /* Lovable --muted-foreground */
  --gold: #8a6c41;         /* Lovable --primary: fills, large type */
  --gold-ink: #7c5c29;     /* design system Ivoire gold: small gold text */
  --gold-tint: #f1e8d8;
  --on-gold: #faf8f5;
  --gold-deep: #5e4520;
  --gold-bright: #b08d57;
  --noir: #0f0e0c;
  --noir-raised: #1b1a17;
  --charcoal: #28292d;     /* design system: the logo's own ground */
  --noir-line: #3a3833;
  --noir-ink: #f2efea;
  --noir-muted: #aaa69e;
  --noir-gold: #c5a574;    /* design system Noir gold */
  --noir-gold-bright: #dcc39a;
  --silver: #c9cace;
  --positive: #2a5d80;
  --positive-tint: #e2ebf2;
  --jade: #1d4237;
  --jade-deep: #10261f;
  --serif: Cormorant, "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --label: Jost, Futura, "Avenir Next", "Helvetica Neue", sans-serif;
  --sans: Manrope, "Helvetica Neue", Arial, sans-serif;
  --script: "Mrs Saint Delafield", "Snell Roundhand", cursive;
}

.s-screen { position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box;
  display: flex; flex-direction: column; background: var(--ivory); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 23px; font-weight: 400; }
.s-screen *, .s-screen *::before, .s-screen *::after { box-sizing: border-box; }
.s-screen p, .s-screen h1, .s-screen h2, .s-screen h3 { margin: 0; }
.s-screen a { color: inherit; text-decoration: none; }

/* The charcoal band that carries the emblem on every ivory screen */
.s-band { flex: none; height: 64px; padding: 10px 8px 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center;
  background: var(--charcoal); color: var(--noir-ink); }
.s-band__logo { justify-self: center; display: block; height: 22px; width: auto; }
.s-band .s-iconbtn { color: var(--noir-ink); }
.s-iconbtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; color: var(--ink); padding: 0; cursor: pointer; }
.s-emblem { display: block; width: auto; }

/* Type */
.s-eyebrow { font-family: var(--label); font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: .26em; text-transform: uppercase; color: var(--gold-ink); }
.s-label { font-family: var(--label); font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-muted); }
.s-display { font-family: var(--serif); font-weight: 300; letter-spacing: -.005em; text-wrap: balance; }
.s-display em, .s-italic { font-style: italic; color: var(--gold); }
.s-title { font-family: var(--serif); font-size: 24px; line-height: 28px; font-weight: 400; }
.s-body { font-size: 15px; line-height: 23px; color: var(--ink); }
.s-small { font-size: 13px; line-height: 19px; color: var(--ink-muted); }
.s-caption { font-size: 11px; line-height: 15px; color: var(--ink-muted); letter-spacing: .02em; }
.s-figure { font-family: var(--sans); font-weight: 200; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.01em; }
.s-sign { font-family: var(--script); font-weight: 400; line-height: 1; color: var(--ink); }

/* The one ornament: the gold foil rule */
.s-rule { display: block; width: 48px; height: 2px; background: linear-gradient(90deg, var(--gold-deep), var(--gold) 35%, var(--gold-bright) 55%, var(--gold) 75%, var(--gold-deep)); }
.s-hair { display: block; height: 1px; background: var(--line); }

/* Buttons: the design system's mobile pill */
.s-btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 24px; border: 1px solid var(--gold); border-radius: 999px;
  background: var(--gold); color: var(--on-gold); font-family: var(--label); font-size: 12px; line-height: 16px; font-weight: 400;
  letter-spacing: .3em; text-transform: uppercase; cursor: pointer; text-align: center; }
.s-btn--secondary { background: transparent; color: var(--gold-ink); }
.s-btn--m { height: 44px; }
.s-btn--ghost { height: 44px; border: 0; border-radius: 0; background: none; padding: 0; color: var(--gold-ink); text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
.s-btn--block { width: 100%; }

/* Bottom tab bar (design system TabBar) */
.s-tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; padding: 0 8px 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--ivory-2); border-top: 1px solid var(--line); }
.s-tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
  color: var(--ink-muted); font-family: var(--label); font-size: 11px; line-height: 12px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
.s-tab--on { color: var(--gold-ink); }
.s-tab--on::before { content: ""; position: absolute; top: 0; left: 50%; width: 24px; height: 2px; margin-left: -12px; border-radius: 2px; background: var(--gold); }

/* Swatches (design system Swatch: gold ring set off the edge) */
.s-swatch { display: block; width: 52px; height: 52px; padding: 0; border-radius: 50%; border: 1px solid var(--line-strong); cursor: pointer; background-size: cover; background-position: center; }
.s-swatch--on { box-shadow: 0 0 0 3px var(--ivory), 0 0 0 4px var(--gold); }

/* Avatars: initials in serif; the designer always wears the gold ring */
.s-avatar { position: relative; display: inline-flex; flex: none; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%;
  background: var(--gold-tint); color: var(--gold-ink); font-family: var(--serif); font-size: 17px; line-height: 1; letter-spacing: .04em; }
.s-avatar--l { width: 60px; height: 60px; font-size: 22px; }
.s-avatar--s { width: 32px; height: 32px; font-size: 13px; }
.s-avatar--designer { box-shadow: 0 0 0 2px var(--ivory), 0 0 0 3px var(--gold); }
.s-avatar--maker { background: var(--jade); color: var(--noir-gold-bright); }
.s-avatar--client { background: var(--ink); color: var(--ivory); }

/* Cards (design system radius-m on touch surfaces), widgets, tags, controls */
.s-card { background: var(--ivory-2); border-radius: 14px; }
.s-card--line { background: transparent; border: 1px solid var(--line); border-radius: 14px; }
.s-card--on { box-shadow: inset 0 0 0 1px var(--gold); background: #f4ecdd; }
.s-widget { background: var(--ivory-2); border-radius: 14px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
.s-widget__head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--gold);
  font-family: var(--label); font-size: 11px; line-height: 14px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-muted); }
.s-tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 2px; font-family: var(--label); font-size: 11px; line-height: 12px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); border: 1px solid var(--line); white-space: nowrap; }
.s-tag--gold { color: var(--gold-ink); background: var(--gold-tint); border-color: transparent; }
.s-tag--positive { color: var(--positive); background: var(--positive-tint); border-color: transparent; }
.s-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.s-switch { position: relative; flex: none; width: 46px; height: 28px; padding: 0; border-radius: 14px; background: var(--ivory-3); border: 1px solid var(--line-strong); cursor: pointer; }
.s-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-muted); transition: left .24s ease-out; }
.s-switch--on { background: var(--gold); border-color: var(--gold); }
.s-switch--on::after { left: 21px; background: var(--on-gold); }
.s-seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; padding: 3px; gap: 3px; }
.s-seg > * { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 8px; border-radius: 999px; font-family: var(--label); font-size: 11px; line-height: 12px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); background: transparent; border: 0; cursor: pointer; }
.s-seg > .s-seg--on { background: var(--ink); color: var(--ivory); }
.s-chip { flex: none; display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font-family: var(--label); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
.s-chip--on { border-color: var(--ink); background: var(--ink); color: var(--ivory); }

/* Noir moments: the invitation, the Passport, the Circle's evening */
.s-noir { background: var(--noir); color: var(--noir-ink); }
.s-noir .s-eyebrow { color: var(--noir-gold); }
.s-noir .s-label, .s-noir .s-small, .s-noir .s-caption { color: var(--noir-muted); }
.s-noir .s-display em, .s-noir .s-italic { color: var(--noir-gold); }
.s-noir .s-rule { background: linear-gradient(90deg, #9a7b4c, var(--noir-gold) 35%, var(--noir-gold-bright) 55%, var(--noir-gold) 75%, #9a7b4c); }
.s-noir .s-sign { color: var(--noir-gold-bright); }
.s-noir .s-btn { background: var(--noir-gold); border-color: var(--noir-gold); color: var(--noir); }
.s-noir .s-btn--ghost { background: none; color: var(--noir-gold-bright); }
.s-noir .s-hair { background: var(--noir-line); }
.s-noir .s-seg { border-color: var(--noir-line); }
.s-noir .s-seg > * { color: var(--noir-muted); }
.s-noir .s-seg > .s-seg--on { background: var(--noir-ink); color: var(--noir); }

/* Lacquer panel with its hidden cloud */
.s-lacquer { position: relative; overflow: hidden; background: var(--jade); transition: background-color .4s ease-out; }
.s-lacquer > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .4s ease-out; }

/* Prototype overlays: sheet, toast, passkey, seal (from the solo Table) */
.s-dim { position: absolute; inset: 0; z-index: 5; background: rgba(15, 14, 12, .55); animation: s-fade .24s ease-out both; }
.s-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 12px 24px 34px; background: var(--ivory-2); border-radius: 14px 14px 0 0;
  box-shadow: 0 -18px 48px rgba(22, 19, 15, .14); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.s-sheet--rise { animation: s-rise .32s ease-out both; }
.s-sheet__grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); }
.s-toast { position: absolute; left: 16px; right: 16px; bottom: 108px; z-index: 9; padding: 14px 16px; border-radius: 14px; background: var(--noir); color: var(--noir-ink);
  display: flex; gap: 12px; align-items: center; font-size: 14px; line-height: 20px; box-shadow: 0 18px 48px rgba(0, 0, 0, .3); animation: s-rise .3s ease-out both; }
.s-toast .s-icon { color: var(--noir-gold); }
.s-faceid { width: 64px; height: 64px; color: var(--gold); }
.s-faceid .s-scan { animation: s-scan .6s ease-in-out infinite alternate; }
.s-sealstage { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px; text-align: center;
  background: rgba(15, 14, 12, .94); color: var(--noir-ink); animation: s-fade .24s ease-out both; }
.s-sealstage .s-after { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; animation: s-fade .3s .45s ease-out both; }
.s-seal--press { animation: s-press .42s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes s-rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes s-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes s-scan { from { opacity: .25; } to { opacity: 1; } }
@keyframes s-press { 0% { transform: scale(1.5) rotate(-8deg); opacity: 0; } 70% { transform: scale(.96) rotate(1deg); opacity: 1; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .s-screen *, .s-screen *::before, .s-screen *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

/* Icons: Phosphor Light from the BuildMyCar design system, painted in currentColor */
.s-icon { display: inline-block; flex: none; width: 24px; height: 24px; background-color: currentColor; vertical-align: middle;
  -webkit-mask: var(--bmc-icon) center / contain no-repeat; mask: var(--bmc-icon) center / contain no-repeat; }
.s-icon--s { width: 16px; height: 16px; }

/* ===== v3: one type system ===== */
/* Names of people, makers, settings, entries and options: the serif, as in the titles. */
.s-item { font-family: var(--serif); font-size: 21px; line-height: 26px; font-weight: 400; color: var(--ink); }
.s-meta { font-size: 12px; line-height: 17px; color: var(--ink-muted); letter-spacing: .01em; }
.s-sign { display: inline-block; }

/* Option tiles, days, time slots, picked cards: state lives in a class, never in inline colour. */
.s-opt { height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 6px; border: 1px solid var(--line); border-radius: 14px;
  background: transparent; color: var(--ink-muted); cursor: pointer; font-family: var(--label); font-size: 11px; line-height: 13px; letter-spacing: .16em; text-transform: uppercase;
  transition: background-color .24s ease-out, color .24s ease-out, border-color .24s ease-out; }
.s-opt--on { background: #f4ecdd; border-color: var(--gold); color: var(--gold-ink); }
.s-day { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; border: 1px solid var(--line); border-radius: 14px;
  background: transparent; color: var(--ink); cursor: pointer; transition: background-color .24s ease-out, color .24s ease-out; }
.s-day__name { font-family: var(--label); font-size: 11px; line-height: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-muted); }
.s-day__num { font-family: var(--serif); font-size: 22px; line-height: 24px; }
.s-day--on { background: var(--ink); border-color: var(--ink); color: var(--ivory); }
.s-day--on .s-day__name { color: #cfc6b6; }
.s-slot { height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: var(--ivory-2); display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  font-family: var(--sans); color: var(--ink); transition: background-color .24s ease-out, box-shadow .24s ease-out; }
.s-slot__there { color: var(--ink-muted); }
.s-slot--on { background: #f4ecdd; box-shadow: inset 0 0 0 1px var(--gold); }
.s-slot--on .s-slot__here { color: var(--gold-ink); }
.s-pick { width: 100%; padding: 12px; border: 0; display: flex; gap: 14px; align-items: center; text-align: left; cursor: pointer; font-family: var(--sans); color: var(--ink);
  transition: background-color .24s ease-out, box-shadow .24s ease-out; }
.s-pick__check { color: var(--gold); opacity: 0; transition: opacity .24s ease-out; }
.s-card--on .s-pick__check { opacity: 1; }
.s-seg > * { transition: background-color .24s ease-out, color .24s ease-out; }
.s-chip { transition: background-color .24s ease-out, color .24s ease-out, border-color .24s ease-out; }
.s-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; column-gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); color: var(--ink); }
[data-twin="img"] { transition: opacity .28s ease-out; }

/* ===== v3: motion (design system: slow and soft, fades and short rises, nothing bounces) ===== */
.s-screen > :not(.s-band):not(.s-tabbar):not(.s-toast):not(.s-sealstage):not(.s-dim):not(.s-photo) {
  animation: s-in .46s cubic-bezier(.2, .7, .2, 1) var(--d, 0ms) both; }
.s-screen > :nth-child(2) { --d: 40ms; } .s-screen > :nth-child(3) { --d: 90ms; } .s-screen > :nth-child(4) { --d: 140ms; }
.s-screen > :nth-child(5) { --d: 190ms; } .s-screen > :nth-child(6) { --d: 240ms; } .s-screen > :nth-child(7) { --d: 290ms; }
.s-screen > :nth-child(8) { --d: 340ms; } .s-screen > :nth-child(9) { --d: 390ms; } .s-screen > :nth-child(10) { --d: 440ms; }
.s-stagger > * { animation: s-in .42s cubic-bezier(.2, .7, .2, 1) var(--e, 200ms) both; }
.s-stagger > :nth-child(2) { --e: 250ms; } .s-stagger > :nth-child(3) { --e: 300ms; } .s-stagger > :nth-child(4) { --e: 350ms; }
.s-stagger > :nth-child(5) { --e: 400ms; } .s-stagger > :nth-child(6) { --e: 450ms; } .s-stagger > :nth-child(7) { --e: 500ms; }
.s-stagger > :nth-child(8) { --e: 550ms; } .s-stagger > :nth-child(9) { --e: 600ms; } .s-stagger > :nth-child(10) { --e: 650ms; }
.s-rule { transform-origin: left center; animation: s-draw .8s .35s cubic-bezier(.2, .7, .2, 1) both; }
.s-rule--center { transform-origin: center; }
.s-sign { animation: s-write 1.5s .6s cubic-bezier(.4, 0, .2, 1) both; }
.s-photo { animation: s-settle 1.4s cubic-bezier(.2, .7, .2, 1) both; }
.s-reveal { animation: s-fadein 2.2s .5s ease-out both; }
.s-pulse { animation: s-pulse 2.4s ease-in-out 1s infinite; }
.s-tab--on::before { animation: s-draw-c .5s .3s ease-out both; }
@keyframes s-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes s-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes s-draw-c { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes s-write { from { clip-path: inset(-.6em 100% -.6em -.6em); } to { clip-path: inset(-.6em -.6em -.6em -.6em); } }
@keyframes s-settle { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: none; } }
@keyframes s-fadein { from { opacity: 0; } }
@keyframes s-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(138, 108, 65, .35); } 50% { box-shadow: 0 0 0 7px rgba(138, 108, 65, 0); } }
@media (prefers-reduced-motion: reduce) {
  .s-screen *, .s-screen > * { animation: s-fadein .01ms both !important; transition-duration: .01ms !important; }
  .s-sign, .s-rule { clip-path: none !important; transform: none !important; }
}

/* ===== v4: the atelier's checklist ===== */
.s-check { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left; cursor: pointer; font-family: var(--sans); color: var(--ink); }
.s-check__box { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center;
  color: transparent; transition: background-color .24s ease-out, border-color .24s ease-out, color .24s ease-out; }
.s-check--on .s-check__box { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.s-fact { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; color: var(--noir-gold);
  font-family: var(--label); font-size: 11px; line-height: 14px; letter-spacing: .14em; text-transform: uppercase; }
.s-fact span:last-child { color: var(--noir-muted); }

/* ===== v5: Noir — the whole app in the design system's dark theme, as in the solo Table =====
   Put .s-dark on any ancestor of .s-screen (the prototype puts it on <html>). Values are the
   design system's Noir tokens: surface #0b0b0c, raised #151517, ink #f2efea, gold #c5a574. */
.s-dark {
  --ivory: #0b0b0c; --ivory-2: #151517; --ivory-3: #1e1e21;
  --line: #2a2a2e; --line-strong: #68686e;
  --ink: #f2efea; --ink-muted: #a3a3a8;
  --gold: #c5a574; --gold-ink: #c5a574; --gold-tint: #1f1a12; --on-gold: #0b0b0c;
  --gold-deep: #9a7b4c; --gold-bright: #dcc39a;
  --positive: #8db7d4; --positive-tint: #111b23;
  --noir: #0b0b0c; --noir-raised: #151517; --noir-line: #2a2a2e;
}
.s-dark .s-screen { color-scheme: dark; }
.s-dark .s-band { background: var(--ivory-2); box-shadow: inset 0 -1px 0 var(--line); }
.s-dark .s-tabbar { background: var(--ivory-2); }
.s-dark .s-card--on, .s-dark .s-opt--on, .s-dark .s-slot--on { background: var(--gold-tint); }
.s-dark .s-day--on .s-day__name { color: #6b665e; }
.s-dark .s-sheet { box-shadow: 0 -1px 0 var(--line), 0 -18px 48px rgba(0, 0, 0, .55); }
.s-dark .s-dim { background: rgba(0, 0, 0, .62); }
.s-dark .s-sealstage { background: rgba(5, 5, 6, .95); }
.s-dark .s-pulse { animation-name: s-pulse-noir; }
@keyframes s-pulse-noir { 0%, 100% { box-shadow: 0 0 0 0 rgba(197, 165, 116, .4); } 50% { box-shadow: 0 0 0 7px rgba(197, 165, 116, 0); } }
/* A toast must stand off any dark ground: the Noir theme, and the Noir moments in Ivoire. */
.s-noir .s-toast, .s-dark .s-toast { background: #1e1e21; box-shadow: inset 0 0 0 1px rgba(197, 165, 116, .45), 0 18px 48px rgba(0, 0, 0, .55); }

/* ===== v6: buttons built on links keep their own ink, in both themes ===== */
.s-screen a.s-btn { color: var(--on-gold); }
.s-screen a.s-btn--secondary, .s-screen a.s-btn--ghost { color: var(--gold-ink); }
.s-noir a.s-btn { color: var(--noir); }
.s-noir a.s-btn--ghost { color: var(--noir-gold-bright); }

/* ===== v7: the house's tablet — landscape, 1180 × 820, shown in the room with the client.
   Always Noir, as the invitations are: it is BMC's own screen, not the client's. ===== */
.s-screen.s-tablet { width: 1180px; height: 820px; font-size: 16px; line-height: 24px; }
.s-tablet .t-top { flex: none; height: 76px; padding: 0 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid var(--noir-line); }
.s-tablet .t-top .s-emblem { height: 28px; }
.s-tablet .t-top__mid { color: var(--noir-muted); letter-spacing: .3em; }
.s-tablet .t-top__right { justify-self: end; display: flex; align-items: center; gap: 10px; }
.s-tablet .t-live { color: var(--noir-gold); border-color: rgba(197, 165, 116, .45); }
.s-tablet .t-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 560px minmax(0, 1fr); }
.s-tablet .t-left { padding: 28px 40px 24px; border-right: 1px solid var(--noir-line); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.s-tablet .t-right { padding: 20px 40px 16px; display: flex; flex-direction: column; min-width: 0; }
.s-tablet .t-title { font-size: 44px; line-height: 48px; color: var(--noir-ink); }
.s-tablet .t-title em { color: var(--noir-gold); }
.s-tablet .t-car { position: relative; height: 290px; border-radius: 14px; overflow: hidden; background: #000; }
.s-tablet .t-car img { display: block; width: 100%; height: 100%; object-fit: cover; }
.s-tablet .t-car .s-tag { position: absolute; right: 12px; top: 12px; color: #e9e1d2; border-color: rgba(242, 239, 234, .35); background: rgba(15, 14, 12, .35); }
.s-tablet .t-note { display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px; color: var(--noir-muted); }
.s-tablet .t-people { display: flex; gap: 26px; margin-top: auto; }
.s-tablet .t-person { display: flex; align-items: center; gap: 12px; min-width: 0; }
.s-tablet .t-av { background: transparent; color: var(--noir-gold); box-shadow: inset 0 0 0 1px rgba(197, 165, 116, .55); }
.s-tablet .t-av--client { background: var(--noir-ink); color: var(--noir); box-shadow: none; }
.s-tablet .t-person__name { display: block; font-family: var(--serif); font-size: 21px; line-height: 24px; color: var(--noir-ink); }
.s-tablet .t-person__role { white-space: nowrap; display: flex; align-items: center; gap: 6px; font-family: var(--label); font-size: 11px; line-height: 15px; letter-spacing: .2em; text-transform: uppercase; color: var(--noir-gold); }
.s-tablet .t-person__role--live { color: #8db7d4; letter-spacing: .06em; text-transform: none; font-family: var(--sans); font-size: 13px; }
.s-tablet .t-row { padding: 14px 0 16px; border-bottom: 1px solid var(--noir-line); display: flex; flex-direction: column; gap: 12px; }
.s-tablet .t-row:last-child { border-bottom: 0; }
.s-tablet .t-row__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.s-tablet .t-lab { color: var(--noir-muted); }
.s-tablet .t-row__value { font-family: var(--serif); font-size: 26px; line-height: 30px; color: var(--noir-ink); white-space: nowrap; }
.s-tablet .t-row__note { font-size: 13px; line-height: 18px; color: var(--noir-muted); }
.s-tablet .t-swatches { display: flex; gap: 14px; }
.s-tablet .s-swatch { width: 76px; height: 46px; border-radius: 8px; border: 1px solid rgba(242, 239, 234, .16); }
.s-tablet .s-swatch--on { box-shadow: 0 0 0 2px var(--noir), 0 0 0 4px var(--noir-gold); }
.s-tablet .t-chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.s-tablet .t-chips .s-chip { justify-content: center; }
.s-tablet .s-chip { height: 42px; padding: 0 20px; border-radius: 21px; border-color: rgba(242, 239, 234, .3); color: var(--noir-ink); font-family: var(--sans); font-size: 15px; }
.s-tablet .s-chip--on { border-color: var(--noir-gold); background: rgba(197, 165, 116, .14); color: var(--noir-gold-bright); }
.s-tablet .t-maker { font-size: 14px; line-height: 20px; color: var(--noir-muted); }
.s-tablet .t-maker b { color: var(--noir-ink); font-weight: 500; }
.s-tablet .t-foot { flex: none; height: 96px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid var(--noir-line); }
.s-tablet .t-foot__left { display: flex; flex-direction: column; gap: 2px; }
.s-tablet .t-foot__line { font-size: 14px; line-height: 20px; color: var(--noir-muted); }
.s-tablet .t-foot__right { display: flex; gap: 14px; }
.s-tablet .t-foot .s-btn { min-width: 250px; height: 56px; }
.s-tablet .s-btn--secondary { background: transparent; border-color: rgba(242, 239, 234, .45); color: var(--noir-ink); }
.s-tablet .t-delta { font-family: var(--serif); font-size: 26px; line-height: 30px; color: var(--noir-gold); }
/* The handover: the Passport opened together, six entries, two signatures. */
.s-tablet .t-seal { display: flex; align-items: center; gap: 22px; }
.s-tablet .t-entries { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.s-tablet .t-entry { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; column-gap: 14px; align-items: center; min-height: 58px; border-bottom: 1px solid var(--noir-line); }
.s-tablet .t-entry:last-child { border-bottom: 0; }
.s-tablet .t-entry__what { font-family: var(--serif); font-size: 21px; line-height: 25px; color: var(--noir-ink); }
.s-tablet .t-entry__who { font-size: 13px; line-height: 18px; color: var(--noir-muted); }
.s-tablet .t-entry .s-sign { font-size: 30px; color: var(--noir-gold-bright); }
.s-tablet .t-entry--open .t-entry__what { color: var(--noir-gold); }
.s-tablet .t-signline { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: auto; padding-bottom: 6px; }

    if (S.view !== 'proto') return;
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); setFocus(!S.focus); }
    else if (S.focus && e.key === 'Escape') { e.preventDefault(); setFocus(false); }
    else if (S.focus && e.key === 'ArrowRight') { e.preventDefault(); story(1); }
    else if (S.focus && e.key === 'ArrowLeft') { e.preventDefault(); story(-1); }
  });

  // Deep link: #two, #all or a screen id such as #S2-Twin.
  // No hash opens the tour. #no_universal_links is the PDF's QR link: it keeps phones in the
  // browser instead of the Claude app, and starts the tour too.
  let h = (location.hash || '').slice(1);
  const phone = window.matchMedia('(max-width: 760px), (max-height: 499px)').matches;
  if (h === 'no_universal_links') h = 'app';
  if (h === '') h = phone || standalone() ? 'app' : 'tour';
  const personaOf = id => ((byId[id].group === 'maker' ? 'huangmei' : byId[id].group === 'atelier' ? 'house' : id === LOGIN ? null : 'liwei'));
  // #P3-signed opens the Passport as it reads once the atelier has signed (3.4).
  if (h === 'P3-signed') { S.signed = true; h = 'P3-Passport'; }
  if (phone && byId[h]) h = 'app/' + (personaOf(h) || '') + '/' + h;
  if (h === 'app//' + LOGIN) h = 'app';
  const tm = h.match(/^tour(?:-(\d+|end))?$/), am = h.match(/^app(?:\/(\w+)\/([\w-]+))?$/);
  if (am) { S.view = 'app'; S.persona = am[1] && PERSONAS[am[1]] ? am[1] : null; S.cur = S.persona && byId[am[2]] ? am[2] : LOGIN; }
  else if (tm) { S.view = 'tour'; S.step = tm[1] === 'end' ? TOUR.length : tm[1] ? Math.max(0, Math.min(TOUR.length - 1, +tm[1] - 1)) : 0; if (S.step < TOUR.length && TOUR[S.step].signed) S.signed = true; }
  else if (h === 'all') S.view = h; else if (byId[h]) S.cur = h;
  render();
  if (S.view === 'app' && S.cur === 'P3-Passport' && S.signed) passportSigned(screenEl());
  if (S.view === 'tour' && S.step < TOUR.length && TOUR[S.step].id === 'P3-Passport') passportSigned(screenEl());
  if (S.view === 'proto' && S.cur === 'P3-Passport' && S.signed) passportSigned(screenEl());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
